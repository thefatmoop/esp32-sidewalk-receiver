[platformio]
default_envs = esp32dev
src_dir = esp32_s2Compatible_loraTest_RX_baseStationForMap/src
include_dir = esp32_s2Compatible_loraTest_RX_baseStationForMap/include
lib_dir = esp32_s2Compatible_loraTest_RX_baseStationForMap/lib

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = chain+
build_flags = -Wall -Wextra
